<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小红书封面生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"PingFang SC","Helvetica Neue",sans-serif;
  background:#f2efe9;color:#1a1a1a;
  min-height:100dvh;padding-bottom:calc(100px + env(safe-area-inset-bottom));
}
.header{text-align:center;padding:24px 20px 6px}
.header h1{font-size:19px;font-weight:800;letter-spacing:0.5px}
.header p{font-size:11px;color:#aaa;margin-top:3px}

.section-label{font-size:11px;color:#999;padding:18px 16px 4px;font-weight:600;letter-spacing:1px}

/* Template chips */
.tpl-scroll{
  display:flex;gap:10px;padding:0 16px 10px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.tpl-scroll::-webkit-scrollbar{display:none}
.tpl-chip{
  flex-shrink:0;text-align:center;cursor:pointer;
}
.tpl-thumb{
  width:64px;height:85px;border-radius:6px;border:2px solid transparent;
  overflow:hidden;transition:all .2s;position:relative;
}
.tpl-chip.active .tpl-thumb{border-color:#d45161;box-shadow:0 0 0 3px rgba(212,81,97,.15)}
.tpl-thumb-inner{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:900;color:#fff;
}
.tpl-label{font-size:10px;color:#888;margin-top:3px}

/* Form */
.fm{
  margin:0 16px 12px;background:#fff;border-radius:12px;padding:16px;
  box-shadow:0 1px 3px rgba(0,0,0,.03);
}
.fm-row{display:flex;gap:8px;margin-bottom:10px}
.fm-row:last-child{margin-bottom:0}
.fg{flex:1}
.fg label{display:block;font-size:10px;font-weight:600;color:#bbb;margin-bottom:4px;letter-spacing:.5px}
.fg input,.fg textarea{
  width:100%;padding:9px 10px;border:1px solid #ebe6df;border-radius:7px;
  font-size:13px;font-family:inherit;background:#faf8f5;outline:none;
}
.fg input:focus,.fg textarea:focus{border-color:#d45161}
.fg textarea{resize:none;height:44px;font-size:12px}

/* Preview */
.pv-wrap{display:flex;justify-content:center;padding:8px 0 16px}
.pv{
  width:300px;height:400px;border-radius:8px;overflow:hidden;
  position:relative;box-shadow:0 6px 24px rgba(0,0,0,.1);
}

/* Btns */
.btns{display:flex;gap:10px;padding:0 16px 16px}
.btn{
  flex:1;padding:11px;border-radius:9px;font-size:13px;font-weight:600;
  font-family:inherit;cursor:pointer;border:none;text-align:center;
}
.btn-dark{background:#1a1a2e;color:#fff}
.btn-light{background:#fff;color:#1a1a2e;border:1.5px solid #e0dbd4}

/* Pricing */
.pcard{
  margin:0 16px 20px;background:#fff;border-radius:12px;padding:20px;
  text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.03);
}
.pcard .badge{
  display:inline-block;background:#1a1a2e;color:#fff;padding:3px 12px;
  border-radius:4px;font-size:10px;font-weight:600;letter-spacing:1px;margin-bottom:10px;
}
.pcard h3{font-size:16px;margin-bottom:2px}
.pcard .price{font-size:34px;font-weight:900;margin:6px 0 2px}
.pcard .price span{font-size:12px;font-weight:400;color:#999}
.pcard .fts{font-size:11px;color:#888;line-height:2;margin:10px 0 14px}
.pcard .ctc{
  display:inline-block;background:#1a1a2e;color:#fff;padding:9px 30px;
  border-radius:7px;font-size:12px;font-weight:600;text-decoration:none;
}
.foot{text-align:center;padding:12px;font-size:10px;color:#ccc}
.toast{
  position:fixed;bottom:120px;left:50%;transform:translateX(-50%);
  background:#1a1a2e;color:#fff;padding:9px 20px;border-radius:18px;
  font-size:12px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;
}
.toast.on{opacity:1}
</style>
</head>
<body>

<div class="header">
  <h1>封面生成器</h1>
  <p>6种小红书爆款布局 · 选模板填文字即出图</p>
</div>

<div class="section-label">模板</div>
<div class="tpl-scroll" id="tplScroll"></div>

<div class="fm">
  <div class="fm-row">
    <div class="fg"><label>分类</label><input id="tag" placeholder="产后修复" maxlength="6" oninput="r()"></div>
    <div class="fg" style="flex:2.5"><label>主标题</label><input id="title" placeholder="肚子松垮不是胖" maxlength="18" oninput="r()"></div>
  </div>
  <div class="fm-row">
    <div class="fg"><label>副标题</label><textarea id="sub" placeholder="是腹直肌分离，3个动作每天10分钟" maxlength="40" oninput="r()"></textarea></div>
  </div>
</div>

<div class="pv-wrap"><div class="pv" id="pv"></div></div>

<div class="btns">
  <button class="btn btn-light" onclick="demo()">🎲 随机示例</button>
  <button class="btn btn-dark" onclick="save()">💾 保存</button>
</div>

<div class="pcard">
  <div class="badge">PRO</div>
  <h3>解锁全部模板 · 高清导出</h3>
  <div class="price">¥29<span>/永久</span></div>
  <div class="fts">30+高级模板 · AI智能配色 · 高清原图 · 无限使用</div>
  <a class="ctc" href="javascript:void(0)" onclick="t('📱 加微信：dandan_freefun')">加微信解锁 →</a>
</div>
<div class="foot">封面生成器 · 演示版</div>
<div class="toast" id="toast"></div>

<script>
const P=document.getElementById('pv');
let cur=0;

const TPLS=[
  {
    id:'photo-title',name:'人物+大字',color:'#d45161',label:'人+字',
    render(tag,title,sub){
      return `
        <div style="position:absolute;inset:0;background:linear-gradient(135deg,#e8d5c8,#d4bcae)"></div>
        <div style="position:absolute;top:14px;left:14px;right:14px;bottom:42%;background:rgba(0,0,0,.08);border-radius:4px;display:flex;align-items:center;justify-content:center">
          <div style="text-align:center;color:rgba(0,0,0,.25)">
            <div style="font-size:40px">📷</div>
            <div style="font-size:10px;margin-top:4px">放你的照片</div>
          </div>
        </div>
        <div style="position:absolute;bottom:0;left:0;right:0;padding:20px 16px 24px;background:linear-gradient(transparent,rgba(0,0,0,.35))">
          <span style="display:inline-block;background:rgba(255,255,255,.25);backdrop-filter:blur(8px);color:#fff;padding:3px 10px;border-radius:10px;font-size:9px;font-weight:600;margin-bottom:8px">${tag||'标签'}</span>
          <div style="font-size:24px;font-weight:900;color:#fff;line-height:1.25;text-shadow:0 2px 6px rgba(0,0,0,.2)">${title||'你的标题'}</div>
          <div style="font-size:11px;color:rgba(255,255,255,.8);margin-top:4px">${sub||'副标题文案'}</div>
        </div>`;
    }
  },
  {
    id:'big-text',name:'纯大字',color:'#1a1a2e',label:'大字',
    render(tag,title,sub){
      return `
        <div style="position:absolute;inset:0;background:#f7f5f0"></div>
        <div style="position:absolute;top:20px;left:20px;z-index:2">
          <span style="font-size:9px;letter-spacing:3px;color:#bbb;font-weight:600">${tag||'TAG'}</span>
        </div>
        <div style="position:absolute;top:50%;left:20px;right:20px;transform:translateY(-50%);z-index:2">
          <div style="font-size:44px;font-weight:900;line-height:1.1;color:#1a1a1a;letter-spacing:-1px">${title||'大字'}</div>
          <div style="width:24px;height:4px;background:#d45161;margin:14px 0"></div>
          <div style="font-size:12px;color:#999;line-height:1.6">${sub||'副标题描述文案'}</div>
        </div>`;
    }
  },
  {
    id:'split',name:'上下分色',color:'#e8725a',label:'分色',
    render(tag,title,sub){
      let lines=(title||'上下分色').split(/[，,]/);
      return `
        <div style="position:absolute;inset:0;background:#f5f0ea"></div>
        <div style="position:absolute;top:0;left:0;right:0;bottom:45%;background:#d45161"></div>
        <div style="position:absolute;top:50%;left:20px;transform:translateY(-50%);z-index:2">
          <span style="background:#fff;color:#d45161;padding:3px 10px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:1px">${tag||'TAG'}</span>
        </div>
        <div style="position:absolute;top:16px;left:20px;right:20px;z-index:2">
          <div style="font-size:30px;font-weight:900;color:#fff;line-height:1.2">${lines[0]||''}</div>
          ${lines[1]?`<div style="font-size:30px;font-weight:300;color:rgba(255,255,255,.8);line-height:1.2">${lines[1]}</div>`:''}
        </div>
        <div style="position:absolute;bottom:28px;left:20px;right:20px;z-index:2">
          <div style="font-size:12px;color:#888;line-height:1.6">${sub||'副标题'}</div>
        </div>`;
    }
  },
  {
    id:'card',name:'卡片式',color:'#4a9e6b',label:'卡片',
    render(tag,title,sub){
      return `
        <div style="position:absolute;inset:0;background:#f0ede6"></div>
        <div style="position:absolute;top:16px;left:16px;right:16px;bottom:16px;background:#fff;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px">
          <div style="font-size:9px;letter-spacing:3px;color:#d45161;font-weight:600;margin-bottom:12px">✦ ${tag||'TAG'} ✦</div>
          <div style="font-size:32px;font-weight:900;color:#1a1a1a;text-align:center;line-height:1.2">${title||'卡片'}</div>
          <div style="width:20px;height:2px;background:#ddd;margin:14px 0"></div>
          <div style="font-size:11px;color:#aaa;text-align:center;line-height:1.6">${sub||'副标题文案描述'}</div>
        </div>`;
    }
  },
  {
    id:'number',name:'数字大字',color:'#f4c542',label:'数字',
    render(tag,title,sub){
      let num='3',rest=title||'个动作';
      let m=title&&title.match(/^(\d+)/);
      if(m){num=m[1];rest=title.slice(m[0].length)||rest;}
      return `
        <div style="position:absolute;inset:0;background:linear-gradient(135deg,#1a1a2e,#2d2d44)"></div>
        <div style="position:absolute;top:20px;right:20px;z-index:2">
          <span style="font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.3)">${tag||'TAG'}</span>
        </div>
        <div style="position:absolute;top:50%;left:24px;right:24px;transform:translateY(-50%);z-index:2">
          <div style="font-size:90px;font-weight:900;color:#f4c542;line-height:.85;letter-spacing:-3px">${num}</div>
          <div style="font-size:28px;font-weight:700;color:#fff;line-height:1.2;margin-top:4px">${rest}</div>
          <div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:10px;line-height:1.5">${sub||'数字强调型封面'}</div>
        </div>`;
    }
  },
  {
    id:'frame',name:'边框留白',color:'#c0392b',label:'边框',
    render(tag,title,sub){
      return `
        <div style="position:absolute;inset:0;background:#fdf8f3"></div>
        <div style="position:absolute;inset:10px;border:2px solid #d45161;border-radius:4px;z-index:1"></div>
        <div style="position:absolute;top:16px;right:20px;z-index:2">
          <span style="writing-mode:vertical-rl;font-size:10px;letter-spacing:2px;color:#d45161;font-weight:600">${tag||'TAG'}</span>
        </div>
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;text-align:center;width:70%">
          <div style="font-size:34px;font-weight:900;color:#3a1a1a;line-height:1.25;letter-spacing:1px">${title||'边框'}</div>
          <div style="width:16px;height:1px;background:#d45161;display:inline-block;margin:14px 0"></div>
          <div style="font-size:11px;color:#a08080;line-height:1.8">${sub||'留白边框风格'}</div>
        </div>`;
    }
  }
];

function buildTplUI(){
  const el=document.getElementById('tplScroll');
  el.innerHTML=TPLS.map((t,i)=>`
    <div class="tpl-chip${i===0?' active':''}" onclick="pick(${i})">
      <div class="tpl-thumb" id="thumb${i}">
        <div class="tpl-thumb-inner" style="background:${t.color}">${t.label}</div>
      </div>
      <div class="tpl-label">${t.name}</div>
    </div>`).join('');
}

function pick(i){cur=i;document.querySelectorAll('.tpl-chip').forEach(c=>c.classList.remove('active'));document.getElementById('thumb'+i).parentElement.classList.add('active');r();}

function r(){
  const tag=document.getElementById('tag').value;
  const title=document.getElementById('title').value;
  const sub=document.getElementById('sub').value;
  P.innerHTML=TPLS[cur].render(tag,title,sub);
}

function demo(){
  const demos=[
    {tag:'产后修复',title:'肚子松垮不是胖',sub:'是腹直肌分离，3个动作每天10分钟'},
    {tag:'健身',title:'八段锦第30天',sub:'从气喘到行云流水，变化太明显'},
    {tag:'宝妈',title:'二胎妈妈高效一天',sub:'做饭带娃运动，时间这样挤'},
    {tag:'成长',title:'30岁我重活了一次',sub:'告别产后抑郁的5个方法'},
    {tag:'婚姻',title:'结婚7年零争吵',sub:'不是忍，是我们约好3件事'},
    {tag:'育儿',title:'二升三暑假这样过',sub:'不报班不焦虑，每天2小时'},
    {tag:'健身',title:'7天改善圆肩驼背',sub:'体态比体重重要100倍'},
    {tag:'修复',title:'腹直肌分离自测',sub:'产后必看！2指以内正常'},
  ];
  const d=demos[Math.floor(Math.random()*demos.length)];
  const ti=Math.floor(Math.random()*TPLS.length);
  document.getElementById('tag').value=d.tag;
  document.getElementById('title').value=d.title;
  document.getElementById('sub').value=d.sub;
  pick(ti);
}

function save(){
  let s=JSON.parse(localStorage.getItem('covers_v3')||'[]');
  s.unshift({
    tpl:TPLS[cur].id,tag:document.getElementById('tag').value,
    title:document.getElementById('title').value,
    sub:document.getElementById('sub').value,
    time:new Date().toLocaleString()
  });
  if(s.length>20)s=s.slice(0,20);
  localStorage.setItem('covers_v3',JSON.stringify(s));
  t('✅ 已保存');
}

function t(m){
  const el=document.getElementById('toast');
  el.textContent=m;el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'),1800);
}

buildTplUI();r();
</script>
</body>
</html>
